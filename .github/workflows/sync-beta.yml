name: Sync beta from community

# beta/community is the rolling integration/build branch at the end of the community
# pipeline: it always mirrors the current community branch plus the beta build tooling.
# On every push to the current community branch, merge whatever triggered
# (github.ref_name) into beta/community and push it. A real merge conflict fails the
# run loudly rather than drifting. Pushing beta/community re-triggers nothing (it's not
# in the trigger list), so there is no loop.
#
# To rotate to a new community branch, change ONLY the branch under `on.push.branches`
# below — everything else derives from the branch that triggered the run. (GitHub does
# not allow variables in the `on:` trigger, so this one line is a literal.)

on:
  push:
    branches:
      - community/05-chat-ux-and-bayonets
  workflow_dispatch:

# Serialize runs so two quick pushes can't race on the beta push.
concurrency:
  group: sync-beta
  cancel-in-progress: false

permissions:
  contents: write

env:
  BETA_BRANCH: beta/community

jobs:
  sync-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BETA_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "codeGlaze"
          git config user.email "github@codeglaze.com"

      - name: Merge the triggering community branch into beta
        run: |
          git fetch origin "${{ github.ref_name }}"
          git merge --no-edit "origin/${{ github.ref_name }}"

      # Gate the push on a clean beta build. build:beta re-ids to the beta system,
      # recompiles packs, and runs validateStage (declared packs present + loadable,
      # module JS parses post-betaify, flags/settings rescoped, manifest fields present).
      # If the merged tree can't produce a valid beta build, fail loudly here and leave
      # beta/community untouched rather than pushing a build that won't install.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build beta (validation gate)
        run: npm run build:beta

      - name: Push beta
        run: git push origin "HEAD:${{ env.BETA_BRANCH }}"
